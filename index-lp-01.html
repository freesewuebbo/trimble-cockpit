<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEANNOVA Layout Planner LP-01</title>
<style>
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:#17252c;background:#fff}.p{padding:14px}.tag{display:inline-block;background:#063b55;color:#fff;font-weight:800;padding:4px 7px;border-radius:4px;font-size:12px;margin-right:6px}.build{background:#009ed2}
h1{font-size:20px;color:#063b55;margin:10px 0 5px}p,.small{font-size:12px;line-height:1.45;color:#68777e}.small{font-size:10px}
.status{font-size:11px;color:#68777e;margin:8px 0;padding:7px;border:1px solid #d4dde1;border-radius:5px;background:#f7f9fa;word-break:break-word}
.models{display:flex;flex-direction:column;gap:5px}.model{border:1px solid #d4dde1;border-radius:5px;padding:7px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.model b{display:block;font-size:12px;color:#063b55}.model span{font-size:10px;color:#68777e}
button{min-height:36px;border:1px solid #bfcbd0;border-radius:5px;background:#fff;font-weight:700;cursor:pointer;padding:7px}.wide{width:100%;margin-top:7px}.primary{background:#063b55;color:#fff;border-color:#063b55}
</style>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script></head>
<body><div class="p">
<span class="tag">LP-01</span><span class="tag build">F11</span>
<h1>Layout Planner</h1>
<p>Geladene Trimble-IFCs werden vor der Übergabe als echte STEP-IFC validiert.</p>
<div class="status" id="status">Verbinde mit Trimble …</div>
<div id="models" class="models"></div>
<button class="wide" id="refresh">Geladene Modelle aktualisieren</button>
<button class="wide primary" id="demo">Demo-Halle öffnen ↗</button>
<div class="small">F11 erkennt IFC-Rohtext, Base64, Blob und gzip automatisch. Erwartete Signatur: ISO-10303-21.</div>
</div>
<script type="module">
import { uploadNewIfcVariant } from "./lp-trimble-upload-f11.js?build=F11";
let API=null;let activeUpload=null;let modelSources=new Map();const status=document.getElementById("status"),modelsBox=document.getElementById("models");
const LP_URL="https://freesewuebbo.github.io/trimble-cockpit/layout-planner-lp-01f11.html?build=F11";
const enc=new TextEncoder(),dec=new TextDecoder("utf-8",{fatal:false});
const setStatus=s=>status.textContent=s;
const clean=s=>String(s||"").replace(/^\uFEFF/,"").trimStart();
const isIfcText=s=>clean(s).startsWith("ISO-10303-21");
function decodeBase64(s){
 let x=String(s||"").trim().replace(/^data:[^,]*,/,"").replace(/\s+/g,"");const r=x.length%4;if(r)x+="=".repeat(4-r);
 const bin=atob(x),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;
}
async function normalizeIfcContent(v){
 let bytes,source;
 if(v instanceof Blob){source="Blob";bytes=new Uint8Array(await v.arrayBuffer())}
 else if(typeof v==="string"){if(isIfcText(v)){source="Rohtext";bytes=enc.encode(v)}else{source="String/Base64";bytes=decodeBase64(v)}}
 else if(v instanceof ArrayBuffer){source="ArrayBuffer";bytes=new Uint8Array(v)}
 else if(ArrayBuffer.isView(v)){source="TypedArray";bytes=new Uint8Array(v.buffer,v.byteOffset,v.byteLength)}
 else throw new Error("Unbekannter Dateiinhalt: "+Object.prototype.toString.call(v));
 const head=clean(dec.decode(bytes.slice(0,512)));
 if(isIfcText(head))return{bytes,source};
 if(bytes[0]===0x1f&&bytes[1]===0x8b){
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
   bytes=new Uint8Array(await new Response(stream).arrayBuffer());
   if(isIfcText(dec.decode(bytes.slice(0,512))))return{bytes,source:source+"→gzip"};
 }
 const ascii=dec.decode(bytes).trim();
 if(ascii.length>32&&/^[A-Za-z0-9+/=\r\n\s]+$/.test(ascii)){
   try{const d=decodeBase64(ascii);if(isIfcText(dec.decode(d.slice(0,512))))return{bytes:d,source:source+"→Base64"}}catch(_){}
 }
 const hex=[...bytes.slice(0,12)].map(x=>x.toString(16).padStart(2,"0")).join(" ");
 throw new Error("Kein STEP-IFC · Quelle "+source+" · "+bytes.length+" Byte · "+hex+" · "+JSON.stringify(head.slice(0,70)));
}
async function openModel(m){
 const win=window.open(LP_URL+"&source=trimble","_blank");if(!win){setStatus("Popup blockiert.");return}
 try{
  const f=await API.viewer.getLoadedModel(m.id);if(!f||f.blob==null)throw new Error("Trimble liefert keinen Dateiinhalt.");
  const n=await normalizeIfcContent(f.blob),b=n.bytes;
  setStatus((f.name||m.name)+" validiert · "+n.source+" · "+b.length+" Byte");
  const buffer=b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength);
  const payload={type:"LP_LOAD_IFC",name:f.name||m.name,modelId:m.id,versionId:m.versionId,buffer};
  modelSources.set(m.id,{name:f.name||m.name,modelId:m.id,versionId:m.versionId});
  let sent=false;const send=()=>{if(sent)return;sent=true;win.postMessage(payload,location.origin,[buffer])};
  const onMsg=e=>{if(e.origin===location.origin&&e.source===win&&e.data?.type==="LP_READY"){window.removeEventListener("message",onMsg);send()}};
  window.addEventListener("message",onMsg);setTimeout(()=>{window.removeEventListener("message",onMsg);send()},2000);
 }catch(e){setStatus("Trimble-Übergabe fehlgeschlagen: "+e.message);try{win.close()}catch(_){}}
}
async function refresh(){
 try{
  const ms=await API.viewer.getModels("loaded");modelsBox.innerHTML="";
  const usable=(ms||[]).filter(m=>String(m.name||"").toLowerCase().endsWith(".ifc")||String(m.type||"").toLowerCase().includes("ifc"));
  if(!usable.length){setStatus("Keine geladene IFC gefunden.");return}
  for(const m of usable){const row=document.createElement("div");row.className="model";const t=document.createElement("div");t.innerHTML="<b>"+m.name+"</b><span>"+(m.type||"IFC")+"</span>";const b=document.createElement("button");b.textContent="Im LP öffnen ↗";b.onclick=()=>openModel(m);row.append(t,b);modelsBox.appendChild(row)}
  setStatus(usable.length+" geladene IFC-Modell(e) gefunden.");
 }catch(e){setStatus("Modelle konnten nicht gelesen werden: "+e.message)}
}
async function connect(){
 try{
  API=await TrimbleConnectWorkspace.connect(window.parent,(event,args)=>{},30000);
  await refresh();
 }catch(e){setStatus("Trimble-Verbindung fehlgeschlagen: "+e.message)}
}
function getAccessTokenFromResult(raw){
 if(typeof raw==="string")return raw;
 if(raw&&typeof raw==="object")return raw.accessToken||raw.token||raw.value||raw.data?.accessToken||null;
 return null;
}
async function handleVariantUpload(e){
 const msg=e.data;
 if(e.origin!==location.origin||!e.source||!API||!msg||msg.type!=="LP_F11_UPLOAD_VARIANT")return;
 if(!modelSources.has(msg.sourceModelId)){
  e.source.postMessage({type:"LP_F11_UPLOAD_RESULT",ok:false,message:"Unbekanntes Ausgangsmodell, Upload abgebrochen."},e.origin);return;
 }
 if(activeUpload){e.source.postMessage({type:"LP_F11_UPLOAD_RESULT",ok:false,message:"Upload läuft bereits."},e.origin);return}
 const source=modelSources.get(msg.sourceModelId);
 if(source.name!==msg.sourceName){e.source.postMessage({type:"LP_F11_UPLOAD_RESULT",ok:false,message:"Ausgangsdatei stimmt nicht überein."},e.origin);return}
 if(!msg.buffer||!(msg.buffer instanceof ArrayBuffer)){e.source.postMessage({type:"LP_F11_UPLOAD_RESULT",ok:false,message:"Keine IFC-Daten erhalten."},e.origin);return}
 activeUpload={name:msg.name};
 const reply=(ok,message,extra={})=>{try{e.source.postMessage({type:"LP_F11_UPLOAD_RESULT",ok,message,...extra},e.origin)}catch(_){}};
 try{
  setStatus("F11 · Prüfe Trimble-Verbindung und Projektrechte …");
  const [project,tokenResult]=await Promise.all([API.project.getProject(),API.getAccessToken()]);
  const token=getAccessTokenFromResult(tokenResult);
  if(!token)throw new Error("Trimble-Zugriffstoken nicht verfügbar.");
  const id=project?.id||project?.projectId;
  if(!id)throw new Error("Trimble-Projekt-ID fehlt.");
  const result=await uploadNewIfcVariant({
   accessToken:token,projectId:id,projectLocation:project?.location||project?.region||"",
   sourceFileId:source.modelId,sourceVersionId:source.versionId,sourceName:source.name,
   targetName:msg.name,buffer:msg.buffer,onProgress:setStatus
  });
  setStatus("Neue IFC angelegt: "+result.name+" · Datei-ID "+result.fileId);
  reply(true,"Neue IFC als eigenständige Datei gespeichert.",{name:result.name,fileId:result.fileId});
 }catch(err){
  const message=String(err?.message||err);
  setStatus("F11 Upload nicht abgeschlossen: "+message);
  reply(false,message);
 }finally{activeUpload=null}
}
window.addEventListener("message",handleVariantUpload);
document.getElementById("refresh").onclick=refresh;document.getElementById("demo").onclick=()=>window.open(LP_URL,"_blank","noopener");connect();
</script></body></html>
